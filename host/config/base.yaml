# Karen – configurazione condivisa (tutte le piattaforme)

transport:
  listen_host: "0.0.0.0"
  listen_port: 7001
  esp32_ip: "192.168.1.89"
  esp32_port: 7002
  upload_stream:
    vad_threshold: 300
    vad_silence_ms: 700
    min_duration_s: 0.5

ha:
  url: "http://192.168.1.100:8123"
  token: "YOUR_HA_LONG_LIVED_TOKEN"
  timeout_s: 5

asr:
  model_path: "whisper-small-ct2"
  language: "it"
  task: "transcribe"
  beam_size: 3
  vad_filter: false
  condition_on_previous_text: false
  initial_prompt: "Karen, assistente vocale italiano. Comandi su ora, meteo, luci, timer."

llm:
  model_path: "phi3-mini-4k-q4_k_m.gguf"
  n_gpu_layers: -1
  context_length: 2048
  max_tokens: 128
  temperature: 0.1
  top_p: 0.9

tts:
  model_path: "it_IT-paola-medium.onnx"
  config_path: "it_IT-paola-medium.onnx.json"
  sample_rate: 22050
  length_scale: 1.0
  use_cuda: false

weather:
  latitude: 45.4654
  longitude: 9.1859
  timezone: "Europe/Rome"
  offline_fallback: true

logging:
  level: "INFO"
  file: null
