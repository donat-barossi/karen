# Karen – configurazione condivisa (tutte le piattaforme)

transport:
  listen_host: "0.0.0.0"
  listen_port: 7001
  esp32_ip: "192.168.1.89"
  esp32_port: 7002
  upload_stream:
    vad_threshold: 300
    vad_silence_ms: 600     # chiudi upload e processa prima dell'END ESP (RX già armato)
    min_duration_s: 0.5

ha:
  url: "http://192.168.1.67:8123"
  token: "YOUR_HA_LONG_LIVED_TOKEN"
  timeout_s: 5
  timezone: "Europe/Rome"
  entities:
    timer: timer.karen
    alarm: input_datetime.karen_alarm
    active: input_boolean.karen_active
    announce_script: script.karen_announce
  calendar:
    entity_id: calendar.outlook   # dopo integrazione Outlook in HA
    reminder_minutes: 15

asr:
  model_path: "whisper-small-ct2"
  language: "it"
  task: "transcribe"
  beam_size: 3
  vad_filter: false
  condition_on_previous_text: false
  # Prompt neutro: esempi di comandi causavano allucinazioni ASR ("Sveglia alle sette").
  initial_prompt: "Conversazione in italiano con un assistente vocale domestico."

llm:
  model_path: "phi3-mini-4k-q4_k_m.gguf"
  n_gpu_layers: -1
  context_length: 2048
  max_tokens: 256
  recipe_max_tokens: 180
  recipe_temperature: 0.05
  temperature: 0.1
  top_p: 0.9

tts:
  model_path: "it_IT-paola-medium.onnx"
  config_path: "it_IT-paola-medium.onnx.json"
  sample_rate: 22050
  length_scale: 1.0
  use_cuda: false

weather:
  latitude: 45.4654
  longitude: 9.1859
  timezone: "Europe/Rome"
  offline_fallback: true

logging:
  level: "INFO"
  file: null              # systemd scrive già su host/karen.log

schedule:
  data_dir: "data"        # host/data/schedules.json (timer e sveglie multipli)
  ring_listen_poll_s: 0.5 # host: polling dismiss mentre ESP suona beep
  ring_dismiss_ack: "Ok!"

pipeline:
  clarify_max_retries: 2
